<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="934" viewBox="0 0 1400 934">
<rect width="1400" height="934" fill="#0f172a"/>
<rect x="40" y="40" width="1320" height="854" rx="18" fill="#111827" stroke="#334155"/>
<text x="70" y="88" font-family="Arial" font-size="24" font-weight="700" fill="#e5e7eb">Extrait backend - verification TOTP</text>
<text x="70" y="130" font-family="Consolas, monospace" font-size="18" fill="#94a3b8">01</text>
<text x="130" y="130" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb">    label = f"{issuer}:{username}"</text>
<text x="70" y="158" font-family="Consolas, monospace" font-size="18" fill="#94a3b8">02</text>
<text x="130" y="158" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb">    return f"otpauth://totp/{label}?secret={secret}&amp;issuer={issuer}&amp;algorithm=SHA1&amp;digits=6&amp;period=30"</text>
<text x="70" y="186" font-family="Consolas, monospace" font-size="18" fill="#94a3b8">03</text>
<text x="130" y="186" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb"></text>
<text x="70" y="214" font-family="Consolas, monospace" font-size="18" fill="#94a3b8">04</text>
<text x="130" y="214" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb"></text>
<text x="70" y="242" font-family="Consolas, monospace" font-size="18" fill="#94a3b8">05</text>
<text x="130" y="242" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb">def _totp(secret: str, counter: int, digits: int = 6) -&gt; str:</text>
<text x="70" y="270" font-family="Consolas, monospace" font-size="18" fill="#94a3b8">06</text>
<text x="130" y="270" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb">    padding = "=" * ((8 - len(secret) % 8) % 8)</text>
<text x="70" y="298" font-family="Consolas, monospace" font-size="18" fill="#94a3b8">07</text>
<text x="130" y="298" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb">    key = base64.b32decode((secret + padding).upper())</text>
<text x="70" y="326" font-family="Consolas, monospace" font-size="18" fill="#94a3b8">08</text>
<text x="130" y="326" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb">    msg = struct.pack("&gt;Q", counter)</text>
<text x="70" y="354" font-family="Consolas, monospace" font-size="18" fill="#94a3b8">09</text>
<text x="130" y="354" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb">    digest = hmac.new(key, msg, hashlib.sha1).digest()</text>
<text x="70" y="382" font-family="Consolas, monospace" font-size="18" fill="#94a3b8">10</text>
<text x="130" y="382" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb">    offset = digest[-1] &amp; 0x0F</text>
<text x="70" y="410" font-family="Consolas, monospace" font-size="18" fill="#94a3b8">11</text>
<text x="130" y="410" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb">    code = struct.unpack("&gt;I", digest[offset:offset + 4])[0] &amp; 0x7FFFFFFF</text>
<text x="70" y="438" font-family="Consolas, monospace" font-size="18" fill="#94a3b8">12</text>
<text x="130" y="438" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb">    return str(code % (10 ** digits)).zfill(digits)</text>
<text x="70" y="466" font-family="Consolas, monospace" font-size="18" fill="#94a3b8">13</text>
<text x="130" y="466" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb"></text>
<text x="70" y="494" font-family="Consolas, monospace" font-size="18" fill="#94a3b8">14</text>
<text x="130" y="494" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb"></text>
<text x="70" y="522" font-family="Consolas, monospace" font-size="18" fill="#94a3b8">15</text>
<text x="130" y="522" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb">def verify_totp(secret: str, code: str, window: int = 1) -&gt; bool:</text>
<text x="70" y="550" font-family="Consolas, monospace" font-size="18" fill="#94a3b8">16</text>
<text x="130" y="550" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb">    if not secret or not code:</text>
<text x="70" y="578" font-family="Consolas, monospace" font-size="18" fill="#94a3b8">17</text>
<text x="130" y="578" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb">        return False</text>
<text x="70" y="606" font-family="Consolas, monospace" font-size="18" fill="#94a3b8">18</text>
<text x="130" y="606" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb">    clean = "".join(ch for ch in str(code) if ch.isdigit())</text>
<text x="70" y="634" font-family="Consolas, monospace" font-size="18" fill="#94a3b8">19</text>
<text x="130" y="634" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb">    if len(clean) != 6:</text>
<text x="70" y="662" font-family="Consolas, monospace" font-size="18" fill="#94a3b8">20</text>
<text x="130" y="662" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb">        return False</text>
<text x="70" y="690" font-family="Consolas, monospace" font-size="18" fill="#94a3b8">21</text>
<text x="130" y="690" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb">    counter = int(time.time() // 30)</text>
<text x="70" y="718" font-family="Consolas, monospace" font-size="18" fill="#94a3b8">22</text>
<text x="130" y="718" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb">    expected_codes = [_totp(secret, counter + offset) for offset in range(-window, window + 1)]</text>
<text x="70" y="746" font-family="Consolas, monospace" font-size="18" fill="#94a3b8">23</text>
<text x="130" y="746" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb">    return any(hmac.compare_digest(clean, expected) for expected in expected_codes)</text>
<text x="70" y="774" font-family="Consolas, monospace" font-size="18" fill="#94a3b8">24</text>
<text x="130" y="774" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb"></text>
<text x="70" y="802" font-family="Consolas, monospace" font-size="18" fill="#94a3b8">25</text>
<text x="130" y="802" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb"></text>
<text x="70" y="830" font-family="Consolas, monospace" font-size="18" fill="#94a3b8">26</text>
<text x="130" y="830" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb">def get_current_user(credentials: HTTPAuthorizationCredentials = Depends(bearer_scheme)):</text>
<text x="70" y="858" font-family="Consolas, monospace" font-size="18" fill="#94a3b8">27</text>
<text x="130" y="858" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb">    from core.database import SessionLocal</text>
<text x="70" y="886" font-family="Consolas, monospace" font-size="18" fill="#94a3b8">28</text>
<text x="130" y="886" font-family="Consolas, monospace" font-size="18" fill="#e5e7eb">    from models.user import User</text>
</svg>